<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Festo — Jack-o'-Lantern Studio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;900&family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="pumpkincarvinggame.css">
</head>
<body class="spooky-studio-body">

  <div class="haunted-manor-bg" aria-hidden="true"></div>
  <div class="drifting-fog-layer" aria-hidden="true"></div>
  <div class="blood-moon-glow" aria-hidden="true"></div>

  <div class="spooky-border top-left-web" aria-hidden="true"></div>
  <div class="spooky-border top-right-web" aria-hidden="true"></div>
  <div class="spooky-border side-ember-left" aria-hidden="true"></div>
  <div class="spooky-border side-ember-right" aria-hidden="true"></div>

  <main class="studio-app-shell">
    
    <header class="studio-header">
      <div class="header-left">
        <a href="../Halloween Landing page/HalloweenLanding.html" class="btn-portal" title="Return to Halloween Hollow">
          <span class="icon">⮌</span>
          <span class="text">Hollow</span>
        </a>
        <div class="brand-text-group">
          <span class="brand-script">Coven Workshop</span>
          <h1 class="brand-title">PUMPKIN CARVER</h1>
        </div>
      </div>

      <div class="header-right">
        <button class="header-action-btn" id="helpModalBtn" aria-label="Game Help & Ideas" title="Studio Guide">
          <i class="fa-solid fa-circle-question" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <div class="studio-workspace">

      <section class="pumpkin-stage-section" aria-label="Pumpkin Canvas Stage">
        
        <div class="stage-toolbar">
          <button class="tool-btn toggle-light-btn" id="toggleLightBtn" aria-label="Light Candle Inside" title="Light Candle">
            <i class="fa-solid fa-fire-flame-curved" aria-hidden="true"></i>
            <span class="btn-label">Candle</span>
          </button>
          
          <button class="tool-btn toggle-room-btn" id="toggleRoomBtn" aria-label="Toggle Night Room Mode" title="Night Mode">
            <i class="fa-solid fa-moon" aria-hidden="true"></i>
            <span class="btn-label">Night</span>
          </button>

          <button class="tool-btn random-idea-btn" id="randomIdeaBtn" aria-label="Generate Random Idea" title="Randomize Stencil">
            <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
            <span class="btn-label">Random</span>
          </button>

          <button class="tool-btn reset-stage-btn" id="resetStageBtn" aria-label="Clear All Carvings" title="Reset Pumpkin">
            <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
            <span class="btn-label">Reset</span>
          </button>
        </div>

        <div class="pumpkin-viewport" id="pumpkinViewport">
          
          <div class="candle-glow-underlay" id="candleGlowUnderlay" aria-hidden="true"></div>

          <div class="pumpkin-body-wrapper" id="pumpkinBodyWrapper" data-shape="classic-round">
            <div class="pumpkin-stem" id="pumpkinStem"></div>
            
            <svg class="pumpkin-svg-mesh" viewBox="0 0 340 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <radialGradient id="pumpkinSkinClassic" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#ff8c1a"/>
                  <stop offset="65%" stop-color="#e65c00"/>
                  <stop offset="100%" stop-color="#802b00"/>
                </radialGradient>
                <radialGradient id="pumpkinSkinGhost" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#f5f7fa"/>
                  <stop offset="70%" stop-color="#c3cfe2"/>
                  <stop offset="100%" stop-color="#687790"/>
                </radialGradient>
                <radialGradient id="pumpkinSkinGoo" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#85e085"/>
                  <stop offset="70%" stop-color="#2eb82e"/>
                  <stop offset="100%" stop-color="#0f3d0f"/>
                </radialGradient>
              </defs>

              <g class="pumpkin-ribs" id="pumpkinRibsGroup">
                <ellipse cx="70" cy="165" rx="55" ry="115" fill="url(#pumpkinSkinClassic)" opacity="0.95"/>
                <ellipse cx="270" cy="165" rx="55" ry="115" fill="url(#pumpkinSkinClassic)" opacity="0.95"/>
                <ellipse cx="115" cy="165" rx="60" ry="122" fill="url(#pumpkinSkinClassic)" opacity="0.98"/>
                <ellipse cx="225" cy="165" rx="60" ry="122" fill="url(#pumpkinSkinClassic)" opacity="0.98"/>
                <ellipse cx="170" cy="165" rx="62" ry="125" fill="url(#pumpkinSkinClassic)"/>
              </g>
            </svg>

            <div class="carving-mount-layer" id="carvingMountLayer">
              <div class="slot-stem-accessory" id="slotStemAccessory"></div>
              <div class="slot-head-accessory" id="slotHeadAccessory"></div>
              <div class="slot-brows" id="slotBrows"></div>
              <div class="slot-eyes" id="slotEyes"></div>
              <div class="slot-nose" id="slotNose"></div>
              <div class="slot-ears" id="slotEars"></div>
              <div class="slot-mouth" id="slotMouth"></div>
              <div class="slot-props" id="slotProps"></div>
            </div>

          </div>

          <div class="stencil-flash" id="stencilFlash" aria-hidden="true"></div>
        </div>

        <div class="stage-footer-actions">
          <button class="stage-action-pill share-design-btn" id="copyIdeaCodeBtn" aria-label="Share Pumpkin Design">
            <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
            <span>Share</span>
          </button>
          <button class="stage-action-pill primary-save" id="exportIdeaCardBtn" aria-label="Save Idea Stencil">
            <i class="fa-solid fa-camera" aria-hidden="true"></i>
            <span>Snapshot</span>
          </button>
        </div>

      </section>

      <section class="toolbox-section" aria-label="Carving Feature Catalog">
        
        <nav class="catalog-category-bar" role="tablist" aria-label="Carving Categories">
          <button class="cat-tab-btn active" role="tab" aria-selected="true" data-category="shapes" tabindex="0">
            <i class="fa-solid fa-shapes" aria-hidden="true"></i>
            <span>Gourds</span>
          </button>

          <button class="cat-tab-btn" role="tab" aria-selected="false" data-category="eyes" tabindex="0">
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
            <span>Eyes</span>
          </button>

          <button class="cat-tab-btn" role="tab" aria-selected="false" data-category="noses" tabindex="0">
            <i class="fa-solid fa-play fa-rotate-270" aria-hidden="true"></i>
            <span>Noses</span>
          </button>

          <button class="cat-tab-btn" role="tab" aria-selected="false" data-category="mouths" tabindex="0">
            <i class="fa-solid fa-teeth-open" aria-hidden="true"></i>
            <span>Mouths</span>
          </button>

          <button class="cat-tab-btn" role="tab" aria-selected="false" data-category="ears" tabindex="0">
            <i class="fa-solid fa-ear-listen" aria-hidden="true"></i>
            <span>Brows</span>
          </button>

          <button class="cat-tab-btn" role="tab" aria-selected="false" data-category="props" tabindex="0">
            <i class="fa-solid fa-hat-wizard" aria-hidden="true"></i>
            <span>Props</span>
          </button>
        </nav>

        <div class="toolbox-header-row">
          <div class="header-text-group">
            <h3 class="toolbox-category-title" id="toolboxCategoryTitle">PUMPKIN SHAPES & SKINS</h3>
            <p class="toolbox-category-subtitle" id="toolboxCategorySubtitle">Choose your raw canvas gourd</p>
          </div>
          <span class="item-count-badge" id="categoryItemCount">6 Options</span>
        </div>

        <div class="options-grid-container" id="optionsGridContainer" role="region" aria-live="polite">
          </div>

      </section>

    </div>

    <aside class="preset-drawer" id="presetDrawer" aria-label="Curated Pumpkin Face Ideas">
      <div class="drawer-header" id="drawerHeaderToggle">
        <div class="drawer-drag-handle" aria-hidden="true"></div>
        <div class="drawer-title-row">
          <i class="fa-solid fa-book-skull" aria-hidden="true"></i>
          <h4>Grimoire Presets</h4>
          <i class="fa-solid fa-chevron-up drawer-chevron" id="drawerChevron" aria-hidden="true"></i>
        </div>
      </div>

      <div class="preset-cards-carousel" id="presetCardsCarousel">
        </div>
    </aside>

    <nav class="vault-dock" aria-label="Quick Hub Switcher">
      <a href="../Halloween Landing page/HalloweenLanding.html" class="dock-item">
        <i class="fa-solid fa-house"></i>
        <span>Hollow</span>
      </a>
      <a href="../Spooky Reads/spookyreads.html" class="dock-item">
        <i class="fa-solid fa-book-skull"></i>
        <span>Reads</span>
      </a>
      <a href="../Halloween Movie List/HalloweenMovie.html" class="dock-item">
        <i class="fa-solid fa-film"></i>
        <span>Cinema</span>
      </a>
      <a href="pumpkincarvinggame.html" class="dock-item active">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>Carving</span>
      </a>
      <a href="../Spectral Map/spectralmap.html" class="dock-item">
        <i class="fa-solid fa-map-location-dot"></i>
        <span>Map</span>
      </a>
      <a href="../Halloween Store/halloweenstore.html" class="dock-item">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>Store</span>
      </a>
      <a href="../Weather/Weather.html" class="dock-item">
        <i class="fa-solid fa-moon"></i>
        <span>Weather</span>
      </a>
    </nav>

  </main>

  <script src="pumpkincarvinggame.js"></script>
</body>
</html>
