<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Witch's Apothecary</title>
  <link rel="stylesheet" href="LandingPage.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=MedievalSharp&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="apothecary-frame">
    <!-- wween countdown -->
    <div class="mobile-header-title">
      <span>Halloween arrives in</span>
      <strong id="halloween-countdown">Loading...</strong>
    </div>

    <!-- Background Canvas for Cobwebs, Fog & Magical Motes -->
    <canvas id="atmosphere-canvas"></canvas>

    <!-- Main Navigation Cabinet -->
    <main class="cabinet">
      
      <!-- Plaque Header -->
      <header class="header-plaque">
        <div class="candle-group left">
          <span class="candle tall"></span>
          <span class="candle short"></span>
        </div>
        <div class="wooden-sign">
          <h1>HAPPY HALLOWEEN</h1>
          <h2>SITE NAVIGATION</h2>
        </div>
        <div class="candle-group right">
          <span class="candle short"></span>
          <span class="candle tall"></span>
        </div>
      </header>

      <!-- TOP SHELF: Grimoire & Spectral Map -->
      <section class="shelf shelf-1">
        <div class="shelf-content">
          
          <!-- Open Grimoire -->
          <a class="shelf-item grimoire-item" href="../Spooky Reads/spookyreads.html" aria-label="Open Spooky Reads">
            <svg viewBox="0 0 200 130" class="svg-graphic">
              <path d="M 10 20 Q 50 10 100 25 Q 150 10 190 20 L 185 115 Q 145 105 100 120 Q 55 105 15 115 Z" fill="#5a1222" stroke="#2a0810" stroke-width="4"/>
              <path d="M 18 24 Q 55 15 98 28 L 98 115 Q 55 102 18 111 Z" fill="#e2c8a0"/>
              <path d="M 182 24 Q 145 15 102 28 L 102 115 Q 145 102 182 111 Z" fill="#ebd6b7"/>
              <path d="M 100 25 L 100 120" stroke="#7a2435" stroke-width="3"/>
              <path d="M 97 120 L 97 130 L 103 125 L 109 130 L 103 120" fill="#a81c38"/>
            </svg>
            <div class="book-titles">
              <span class="page-title">Spooky<br>Reads</span>
            </div>
          </a>

          <a class="shelf-item bat-item" href="../Halloween Store/Arts And Crafts Store/artsandcraftssrore.html">
            <span class="bat-graphic" aria-hidden="true">🦇</span>
            <span class="bat-label">Halloween<br>Crafts</span>
          </a>

          <!-- Unrolled Scroll Map -->
          <a class="shelf-item scroll-item" href="../Spectral Map/spectralmap.html" aria-label="Open Spectral Map">
            <svg viewBox="0 0 120 150" class="svg-graphic">
              <path d="M 20 15 C 20 5, 100 5, 100 15 L 100 135 C 100 145, 20 145, 20 135 Z" fill="#d1ae70" stroke="#52391b" stroke-width="3"/>
              <path d="M 15 10 C 15 0, 105 0, 105 10 C 105 20, 15 20, 15 10 Z" fill="#9a713d" stroke="#3b2610" stroke-width="2"/>
              <path d="M 15 140 C 15 130, 105 130, 105 140 C 105 150, 15 150, 15 140 Z" fill="#9a713d" stroke="#3b2610" stroke-width="2"/>
              <path d="M 30 48 Q 55 30 78 52 T 92 93 M 30 105 Q 55 82 82 105 M 45 70 L 68 88 M 72 42 L 50 56" fill="none" stroke="#68451f" stroke-width="2" stroke-dasharray="3 2"/>
            </svg>
            <div class="scroll-title">Spectral<br>Map</div>
          </a>

        </div>
        <div class="shelf-board"></div>
      </section>

      <!-- SECOND SHELF: Allowed Food & Halloween List -->
      <section class="shelf shelf-2">
        <div class="shelf-content">
          
          <!-- Cauldron -->
          <a class="shelf-item cauldron-item" href="../Halloween Store/Snacks Store/snacksstore.html">
            <div class="cauldron-bubbles"></div>
            <svg viewBox="0 0 140 120" class="svg-graphic">
              <ellipse cx="70" cy="30" rx="50" ry="12" fill="#00ff66" filter="drop-shadow(0 0 8px #00ff66)"/>
              <path d="M 20 30 Q 10 80 40 105 Q 70 115 100 105 Q 130 80 120 30 Q 70 38 20 30 Z" fill="#22252a" stroke="#111215" stroke-width="4"/>
              <path d="M 35 60 Q 70 75 105 60 Q 100 85 70 85 Q 40 85 35 60 Z" fill="#a87a2a" stroke="#543c11" stroke-width="2"/>
            </svg>
            <div class="cauldron-label">Allowed<br>Food</div>
          </a>

          <!-- Wooden List Plaque -->
          <a class="shelf-item list-item" href="../Halloween Store/Decerations Store/decerationsstore.html">
            <svg viewBox="0 0 130 110" class="svg-graphic">
              <path d="M 15 10 Q 65 0 115 10 Q 125 55 115 100 Q 65 110 15 100 Q 5 55 15 10 Q 65 20 115 10" fill="#6e4722" stroke="#38210b" stroke-width="4"/>
              <path d="M 22 18 Q 65 10 108 18 Q 116 55 108 92 Q 65 100 22 92 Q 14 55 22 18 Z" fill="#4d3014"/>
            </svg>
            <div class="list-label">Hallowen<br>List</div>
          </a>

        </div>
        <div class="shelf-board"></div>
      </section>

      <!-- THIRD SHELF: Movie List Jars & Film Reels -->
      <section class="shelf shelf-3">
        <div class="shelf-content flex-center">
          
          <a class="shelf-item movie-item" href="../Halloween Movie List/halloweenmovie.html">
            <div class="apothecary-jars">
              <span class="jar jar-purple"></span>
              <span class="jar jar-green"></span>
              <span class="jar jar-amber"></span>
              <span class="jar jar-magenta"></span>
            </div>
            <div class="film-reels">
              <div class="reel"></div>
              <div class="reel"></div>
            </div>
            <div class="gold-shelf-label">Movie List</div>
          </a>

        </div>
        <div class="shelf-board"></div>
      </section>

      <!-- FOURTH SHELF: Carving Game Pumpkins -->
      <section class="shelf shelf-4">
        <div class="shelf-content flex-center">
          
          <a class="shelf-item carving-item" href="../Pumpkin Carving Game/pumpkincarvinggame.html">
            <div class="pumpkins-row">
              <div class="jack-lantern p1"></div>
              <div class="jack-lantern p2"></div>
              <div class="jack-lantern p3"></div>
              <div class="jack-lantern p4"></div>
              <div class="jack-lantern p5 with-knives"></div>
            </div>
            <div class="gold-shelf-label">Carving Game</div>
          </a>

        </div>
        <div class="shelf-board"></div>
      </section>

      <!-- BOTTOM SHELF: Countdown & Music -->
      <section class="shelf shelf-5">
        <div class="shelf-content">
          
          <!-- Costume store -->
          <a class="shelf-item costume-item" href="../Halloween Store/Costumes Store/costumesstore.html">
            <div class="costume-mask" aria-hidden="true">☠</div>
            <div class="gold-shelf-label">Costume<br>Store</div>
          </a>

          <!-- Gramophone Music -->
          <a class="shelf-item music-item" href="../Halloween Music/halloweenmusic.html">
            <div class="gramophone-wrapper">
              <div class="brass-horn-svg">
                <svg viewBox="0 0 80 80">
                  <path d="M 10 70 Q 30 50 50 40 Q 70 20 75 5 Q 40 10 30 40 Q 20 50 10 70 Z" fill="#ffd700" stroke="#b8860b" stroke-width="2"/>
                </svg>
              </div>
              <div class="floating-notes">
                <span class="note n1">♪</span>
                <span class="note n2">♫</span>
              </div>
              <div class="gramophone-base"></div>
            </div>
            <div class="gold-shelf-label">Halloween<br>Music</div>
          </a>

        </div>
        <div class="shelf-board"></div>
      </section>

    </main>

  </div>

  <script src="LandingPage.js"></script>
</body>
</html>
