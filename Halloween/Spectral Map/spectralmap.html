<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectral Map — Paranormal & Halloween Live Radar</title>
  
  <!-- Custom Stylesheet Reference -->
  <link rel="stylesheet" href="spectralmap.css">
  
  <!-- Leaflet Interactive Map Engine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="spectral-map-body">

  <!-- Ambient Animated Fog Overlay -->
  <div class="ambient-radar-fog" aria-hidden="true"></div>

  <!-- Master App Shell Container -->
  <main class="spectral-app-shell">

    <!-- App Branding & Search Header -->
    <header class="spectral-header">
      <div class="brand-title-row">
        <div class="brand-title-wrap">
          <h1 class="brand-title">
            SPECTRAL RADAR
            <span class="brand-subtitle">LIVE HAUNT & PARANORMAL TRACKER</span>
          </h1>
          <span class="brand-ghost" aria-hidden="true">👻</span>
        </div>
      </div>

      <!-- Real-Time Search & Radar Feed Filter -->
      <div class="search-bar-wrap">
        <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
        <input type="search" id="locationSearchInput" class="spectral-search-input" placeholder="Search haunted spots, Spirit Halloween, graveyards..." aria-label="Search map points">
        <button class="locate-me-btn" id="locateUserBtn" aria-label="Find my current spooky coordinates">
          <i class="fa-solid fa-crosshairs" aria-hidden="true"></i>
        </button>
      </div>

      <!-- Category Filter Pills Bar -->
      <nav class="category-filter-bar" role="tablist" aria-label="Location Categories">
        <button class="filter-pill active" role="tab" aria-selected="true" data-filter="all">
          <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
          <span>All Encounters</span>
        </button>
        <button class="filter-pill" role="tab" aria-selected="false" data-filter="graveyards">
          <i class="fa-solid fa-monument" aria-hidden="true"></i>
          <span>Graveyards</span>
        </button>
        <button class="filter-pill" role="tab" aria-selected="false" data-filter="haunts">
          <i class="fa-solid fa-house-chimney-crack" aria-hidden="true"></i>
          <span>Haunted Houses</span>
        </button>
        <button class="filter-pill" role="tab" aria-selected="false" data-filter="spirit">
          <i class="fa-solid fa-ghost" aria-hidden="true"></i>
          <span>Spirit Halloween</span>
        </button>
        <button class="filter-pill" role="tab" aria-selected="false" data-filter="investigations">
          <i class="fa-solid fa-skull" aria-hidden="true"></i>
          <span>Paid Investigations</span>
        </button>
      </nav>
    </header>

    <!-- Interactive Live Map Viewport Area -->
    <div class="map-viewport-wrapper">
      
      <!-- Leaflet Map Container -->
      <div id="spectralMap" class="spectral-leaflet-container" role="region" aria-label="Interactive Paranormal Map"></div>

      <!-- Real-Time Radar Scanner Sweep Overlay -->
      <div class="radar-sweep-effect" id="radarSweep" aria-hidden="true">
        <div class="radar-line"></div>
      </div>

      <!-- Quick Map Action Layer (Toggle Layers, Re-Center) -->
      <div class="map-floating-controls">
        <button class="map-fab-btn" id="toggleHeatmapBtn" aria-label="Toggle EMF Ghost Heatmap">
          <i class="fa-solid fa-radiation" aria-hidden="true"></i>
          <span class="fab-tooltip">EMF Heatmap</span>
        </button>
        <button class="map-fab-btn" id="recenterMapBtn" aria-label="Reset Map View">
          <i class="fa-solid fa-compass" aria-hidden="true"></i>
          <span class="fab-tooltip">Reset Center</span>
        </button>
        <button class="map-fab-btn" id="toggleListDrawerBtn" aria-label="Toggle Locations Drawer">
          <i class="fa-solid fa-list-ul" aria-hidden="true"></i>
          <span class="fab-tooltip">View List</span>
        </button>
      </div>

      <!-- Live EMF Paranormal Activity Meter Pill -->
      <div class="emf-activity-hud" aria-live="polite">
        <div class="emf-leds">
          <span class="led green on"></span>
          <span class="led green on"></span>
          <span class="led yellow on"></span>
          <span class="led orange"></span>
          <span class="led red"></span>
        </div>
        <div class="emf-readout">
          <span class="emf-label">LOCAL EMF:</span>
          <span class="emf-value" id="emfValue">3.8 mG</span>
        </div>
      </div>

    </div>

    <!-- Sliding Locations Feed & Booking Drawer -->
    <section class="locations-sliding-drawer" id="locationsDrawer" aria-label="Nearby Haunts and Booking Feed">
      
      <!-- Drawer Drag Handle & Counter Banner -->
      <div class="drawer-drag-header" id="drawerHeaderToggle">
        <div class="drawer-grabber" aria-hidden="true"></div>
        <div class="drawer-header-content">
          <div class="drawer-title-group">
            <i class="fa-solid fa-satellite-dish" aria-hidden="true"></i>
            <h2 class="drawer-title">Nearby Paranormal Radar Feed</h2>
          </div>
          <span class="locations-counter-tag" id="locationsCounter">18 Live Signals</span>
          <i class="fa-solid fa-chevron-up drawer-expand-arrow" id="drawerExpandArrow" aria-hidden="true"></i>
        </div>
      </div>

      <!-- Scrollable List of Spots & Paid Booking Opportunities -->
      <div class="locations-feed-list" id="locationsFeedList">
        <!-- Injected dynamically via JavaScript -->
      </div>
    </section>

    <!-- Modal Booking / Detail Popup Overlay -->
    <aside class="spectral-detail-modal" id="locationDetailModal" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-backdrop-veil" id="modalBackdropVeil"></div>
      <div class="modal-card-container">
        <button class="modal-close-btn" id="closeModalBtn" aria-label="Close details">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
        <div class="modal-scroll-body" id="modalDynamicContent">
          <!-- Injected dynamically via JavaScript upon clicking a marker or list item -->
        </div>
      </div>
    </aside>

    <!-- Persistent Bottom App Navigation Dock -->
    <nav class="spectral-bottom-dock" aria-label="Primary App Dock">
      <a href="#radar" class="dock-item active" aria-label="Radar Map">
        <i class="fa-solid fa-map-location-dot" aria-hidden="true"></i>
        <span class="dock-label">Radar Map</span>
      </a>
      <a href="#feed" class="dock-item" aria-label="Haunts Feed">
        <i class="fa-solid fa-house-chimney-crack" aria-hidden="true"></i>
        <span class="dock-label">Haunts</span>
      </a>
      <a href="#investigate" class="dock-item" aria-label="Book Investigation">
        <i class="fa-solid fa-skull-crossbones" aria-hidden="true"></i>
        <span class="dock-label">Investigate</span>
      </a>
      <a href="#saved" class="dock-item" aria-label="Saved Hotspots">
        <i class="fa-solid fa-bookmark" aria-hidden="true"></i>
        <span class="dock-label">Saved</span>
      </a>
    </nav>

  </main>

  <!-- Leaflet Map Engine JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Application Core Script -->
  <script src="spectralmap.js"></script>
</body>
</html>
