    /* Returning visitors go straight to the season they made home. Add ?choose=1 to this page to change it. */
    (function () {
      try {
        if (/[?&]choose\b/.test(location.search)) return;
        var s = JSON.parse(localStorage.getItem('festo_home_season'));
        var M = { spring: 'Spring/SpringLanding/SpringLanding.html', summer: 'Summer/Summer%20Landing/SummerLanding.html', halloween: 'Halloween/Halloween%20Landing%20page/HalloweenLanding.html', christmas: 'Christmas/Christmas%20Landing/ChristmasLanding.html' };
        if (M[s]) location.replace(M[s]);
      } catch (e) { /* storage blocked: show the chooser */ }
    })();
  </script>
